name: CI - Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache NestJS
        uses: actions/cache@v4
        with:
          path: .nest/cache
          key: ${{ runner.os }}-nest-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npm run build

  unit-tests-check:
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  tests-e2e-check:
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: cp .envs/.env.test-EXAMPLE .envs/.env.test
      - run: npm run docker:test:e2e

  staging-check:
    runs-on: ubuntu-latest
    needs: health-check
    needs: [unit-tests-check, tests-e2e-check]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: cp .envs/.env.staging-EXAMPLE .envs/.env.staging
      
      - name: Start staging
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml --env-file .envs/.env.staging up -d

      - name: Validate app is running
        run: |
          sleep 10
          curl --fail http://localhost:3001
      
      - name: Stop staging
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml down

