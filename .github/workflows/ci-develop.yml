name: CI - Develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache NestJS
        uses: actions/cache@v4
        with:
          path: .nest/cache
          key: ${{ runner.os }}-nest-${{ hashFiles('**/package-lock.json') }}

      - run: npm ci
      - run: npm run build

  unit-tests-check:
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  tests-e2e-check:
    runs-on: ubuntu-latest
    needs: health-check

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run docker:test:e2e
