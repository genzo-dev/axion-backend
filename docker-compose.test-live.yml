services:
  app:
    build:
      target: development
    image: axion-backend-app:test
    command: npm run start:dev
    env_file:
      - .envs/.env.test
    ports:
      - '${LOCAL_PORT_APP}:${DOCKER_PORT_APP}'

  postgres:
    env_file:
      - .envs/.env.test
    ports:
      - '${LOCAL_PORT_DB}:${DOCKER_PORT_DB}'
    tmpfs:
      - /var/lib/postgresql/data
