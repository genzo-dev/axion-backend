services:
  app:
    build:
      target: development
    command: npm run start:dev
    volumes:
      - .:/app
      - node_modules-dev:/app/node_modules
    ports:
      - '3000:3000'
    env_file:
      - .envs/.env.dev
    environment:
      - CHOKIDAR_USEPOLLING=true

  postgres:
    env_file:
      - .envs/.env.dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
  node_modules-dev:
